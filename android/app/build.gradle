plugins { id 'com.android.application' }

android {
    namespace 'com.choui.animatedinventory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.choui.animatedinventory'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
